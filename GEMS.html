<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2F72">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GEMS</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2F72; --deep:#061A44; --blue:#1F5BC4; --sky:#3EC5F0; --cyan:#22B5DC;
  --bg:#F2F5FA; --card:#FFFFFF; --raise:#EAF0F9; --line:#DCE4F1; --ink:#0E1B36; --muted:#5C6B88;
  --ok:#1E9E6A; --warn:#C98A12; --bad:#D64545; --r:16px; --shadow:0 1px 2px rgba(14,27,54,.05),0 8px 24px rgba(14,27,54,.06);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* ---------- Header (animated) ---------- */
.top{position:sticky;top:0;z-index:20;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 14px;background:linear-gradient(115deg,#0A2F72,#1F5BC4,#0A2F72,#061A44);background-size:300% 300%;animation:flow 14s ease infinite;overflow:hidden;box-shadow:0 10px 30px rgba(6,26,68,.28)}
.top::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% -20%,rgba(62,197,240,.35),transparent 55%);pointer-events:none}
.top::after{content:"";position:absolute;left:-30%;top:0;bottom:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-18deg);animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes sheen{0%{left:-40%}60%,100%{left:120%}}
.tr{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.mark{width:42px;height:42px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bn{font-family:"Barlow Condensed",Manrope,sans-serif;font-weight:800;font-size:24px;letter-spacing:3px;line-height:1}
.bs{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.78;margin-top:3px;font-weight:700}
.hdate{text-align:right;font-size:12px;opacity:.9;font-weight:700;line-height:1.3}
.hdate b{display:block;font-size:17px;letter-spacing:.2px}
.tline{position:relative;z-index:1;margin-top:10px;font-size:13px;font-weight:700;opacity:.95;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;backdrop-filter:blur(4px)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 0 rgba(62,197,240,.7);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(62,197,240,.7)}70%,100%{box-shadow:0 0 0 8px rgba(62,197,240,0)}}

/* ---------- Main ---------- */
main{padding:18px 16px 24px;animation:pageIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:24px;font-weight:800;margin:2px 0 4px;letter-spacing:-.2px}
h2{font-size:16px;font-weight:800;margin:0 0 10px;letter-spacing:-.1px}
.sub{color:var(--muted);font-size:13.5px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;gap:10px}
.sec h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec h3::before{content:"";display:inline-block;width:6px;height:6px;background:var(--cyan);transform:rotate(45deg);margin-right:8px;vertical-align:1px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.qa{grid-template-columns:repeat(6,1fr)}}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:12.5px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.qa button:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 12px 26px rgba(31,91,196,.14)}
.qa button:active{transform:scale(.97)}
.qa svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.qa button:hover svg{transform:scale(1.12) rotate(-4deg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:800;font-size:14.5px;box-shadow:0 8px 20px rgba(31,91,196,.28);transition:transform .15s,box-shadow .2s,opacity .2s;position:relative;overflow:hidden}
.btn:hover{box-shadow:0 12px 26px rgba(31,91,196,.34)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;box-shadow:none}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #F3C6C6;box-shadow:none}
.btn.sm{min-height:36px;padding:8px 12px;font-size:13px;border-radius:10px}
.lnk{background:none;border:0;color:var(--blue);font-weight:800;font-size:14px;padding:8px 4px;min-height:40px}
.ico{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:48px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,91,196,.12)}
label.f{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin:14px 0 0;letter-spacing:.02em}
label.f input,label.f select,label.f textarea{margin-top:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:800;font-size:13.5px;color:var(--muted);min-height:40px;transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(14,27,54,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;color:var(--muted);min-height:38px;transition:all .2s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(31,91,196,.25)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--raise);color:var(--blue);white-space:nowrap}
.tag.ok{background:#E3F6EE;color:#17754F}.tag.warn{background:#FDF3DF;color:#8A5B07}.tag.bad{background:#FCE7E7;color:#A52E2E}

.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.li:last-child{border-bottom:0}
.li:hover{background:linear-gradient(90deg,transparent,rgba(31,91,196,.04),transparent)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none;background:linear-gradient(135deg,var(--blue),var(--navy))}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed #C8D3E6;border-radius:14px;background:#FAFBFE;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px;box-shadow:0 14px 34px rgba(6,26,68,.35);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Bottom bar ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:760px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(14,27,54,.06)}
nav button{background:none;border:0;color:var(--muted);font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:54px;border-radius:12px;transition:color .25s,background .25s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--blue)}
nav button.on svg{transform:translateY(-2px) scale(1.08)}
nav button.on::after{content:"";width:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));margin-top:1px}

/* ---------- Opening screen ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#15458F 0%,#0A2F72 38%,#061A44 80%);overflow:hidden;transition:opacity .8s ease,visibility .8s}
#splash.out{opacity:0;visibility:hidden}
#splash .lines{position:absolute;inset:0;pointer-events:none}
#splash .lines path{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1.2;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.8s .1s ease forwards}
#splash .lines path:nth-child(2){animation-delay:.5s;stroke:rgba(62,197,240,.16)}
#splash .lines path:nth-child(3){animation-delay:.9s}
@keyframes draw{to{stroke-dashoffset:0}}
#splash .c{position:relative;text-align:center;padding:24px}
#splash .big{width:136px;height:136px;margin:0 auto;filter:drop-shadow(0 22px 40px rgba(0,0,0,.45));animation:logoIn 1s cubic-bezier(.2,.8,.2,1) both}
#splash .w{font-family:"Barlow Condensed",Manrope,sans-serif;font-weight:800;font-size:64px;letter-spacing:6px;color:#fff;margin-top:26px;line-height:1;display:flex;justify-content:center}
#splash .w span{display:inline-block;opacity:0;transform:translateY(18px);animation:letter .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.7s + var(--k) * 90ms)}
#splash .s{margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.42em;color:#9CC6F0;opacity:0;animation:fadeIn .8s 1.5s forwards}
#splash .p{position:absolute;left:50%;bottom:12%;width:44%;max-width:220px;height:3px;transform:translateX(-50%);background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#splash .p span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#A6EBFF);animation:load 2.8s .3s cubic-bezier(.3,.7,.2,1) forwards}
#splash .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-100%);animation:sweep 2.4s 1.1s ease forwards;pointer-events:none}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes load{to{width:100%}}
@keyframes sweep{to{transform:translateX(100%)}}

/* ---------- Logo animation ---------- */
.lg-f{animation:fIn .6s ease both;animation-delay:calc(.25s + var(--n,0) * .08s);transform-box:fill-box;transform-origin:center}
@keyframes fIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lg-glint{animation:glint 4.5s ease-in-out infinite}
@keyframes glint{0%,70%,100%{opacity:0}80%{opacity:.9}}

/* ---------- Timetable ---------- */
.tt{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.tt th{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.tt th.today{color:var(--blue)}
.tt td{vertical-align:top}
.tt .tm{width:58px;font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.25;vertical-align:middle}
.cell{border-radius:11px;padding:8px 7px;min-height:64px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;border-left:4px solid var(--c,#DCE4F1)}
.cell:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(14,27,54,.1)}
.cell.empty2{background:#FAFBFE;border-style:dashed;color:#9AA7C0;text-align:center;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.cell b{display:block;font-size:12px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.now{box-shadow:0 0 0 2px var(--cyan)}
.cell.now::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(34,181,220,.16),transparent);transform:translateX(-100%);animation:sweep 2.8s infinite}
.brk-row td{background:linear-gradient(90deg,#F3F7FD,#EAF2FC);border-radius:9px;text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:6px;letter-spacing:.08em;text-transform:uppercase}
.leg{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;font-weight:700}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.dayrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dayrow button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 2px;font-weight:800;color:var(--muted);min-height:50px;font-size:13px;transition:all .2s}
.dayrow button small{display:block;font-size:10px;font-weight:700;opacity:.8}
.dayrow button.on{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(31,91,196,.3)}
.dayrow button.td::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin:3px auto 0}
.photo{width:100%;border-radius:14px;border:1px solid var(--line);background:#0B1A33;display:block;max-height:420px;object-fit:contain}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dw{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:11px;background:#fff;font-weight:800;font-size:13.5px;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;transition:transform .15s,background .2s}
.cal button:active{transform:scale(.94)}
.cal button.we{color:#9AA7C0}
.cal button.hol{background:#FCE9E9;color:#A52E2E}
.cal button.brk{background:#E3F6EE;color:#17754F}
.cal button.exm{background:#EEE9FC;color:#5B3FC4}
.cal button.pd{background:#FDF3DF;color:#8A5B07}
.cal button.tod{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cal button.sel{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff}
.cal button i{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.cal button.sel i{background:#fff}

/* ---------- Marking sheet ---------- */
.sheet{background:#FFFDF6;color:#1B2538;border-radius:14px;padding:6px 14px 8px;box-shadow:0 10px 26px rgba(14,27,54,.12);border:1px solid #EFE7CF}
.sheet .h{display:flex;justify-content:space-between;align-items:center;padding:10px 0 8px;border-bottom:2px solid #1B2538;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.mrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed #C9CFDC;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mm{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800;flex:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.mrow:active .mm{transform:scale(.9)}
.mm.g{background:#1E9E6A}.mm.r{background:#D64545}.mm.u{background:#C98A12}
.mb{flex:1;min-width:0}
.mq{font-weight:800;font-size:15.5px;line-height:1.35}
.ml{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-top:4px}
.ml span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5A6780;font-weight:800;min-width:92px}
.st{color:#D64545;text-decoration:line-through;text-decoration-thickness:2px;font-weight:700}
.rt{color:#1E7F59;font-weight:800;font-size:16px}
.verdict{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(14,27,54,.1);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--raise) 0);animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both}
.ring span{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
@keyframes ringIn{from{transform:rotate(-120deg) scale(.7);opacity:0}}
.vt{font-size:24px;font-weight:800;color:var(--c);line-height:1.1}
.ans{margin-top:10px;background:#EEF5FF;border-left:4px solid var(--cyan);border-radius:12px;padding:12px 14px}
.ans span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--blue);margin-bottom:4px}

/* ---------- Misc ---------- */
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:800;color:var(--blue)}
.stepper b{min-width:44px;text-align:center;font-size:17px}
.dbg{font-size:12px;color:var(--muted);margin-top:8px;word-break:break-word}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.burst{position:fixed;width:9px;height:9px;background:var(--cyan);transform:translate(-50%,-50%) rotate(45deg);animation:bst .95s ease-out forwards;z-index:70;pointer-events:none;border-radius:2px}
@keyframes bst{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(225deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{nav,.top,.noprint{display:none!important}.app{padding:0;max-width:none}main{padding:0}}

      this.rr(x0, this.y, W, 24, 5, PDFC.navy);
      let x = x0;
      cols.forEach((c, i) => {
        const al = c.align || 'left', tx = al === 'center' ? x + cw[i] / 2 : al === 'right' ? x + cw[i] - pad : x + pad;
        this.text(pdfFit(c.h || '', cw[i] - pad * 2, true, 8.5), tx, this.y + 8, { size: 8.5, bold: true, color: '#FFFFFF', align: al });
        x += cw[i];
      });
      this.y += 24;
    };
    this.ensure(60); head();
    const norm = c => (c !== null && typeof c === 'object') ? c : { t: c };
    rows.forEach((row, ri) => {
      if (row && row.span !== undefined) {
        const h = 22; if (this.y + h > this.bottom) { this.newPage(false); head(); }
        this.rect(x0, this.y, W, h, pMix(PDFC.blue, 0.88));
        this.rect(x0, this.y, 3, h, PDFC.blue);
        this.text(row.span, x0 + 12, this.y + 6, { size: 9.5, bold: true, color: PDFC.navy });
        this.y += h; return;
      }
      const cells = cols.map((c, i) => norm(row[i]));
      let h = o.minH || 24;
      const lay = cells.map((c, i) => {
        const b = !!c.b, sz = c.size || size, ww = cw[i] - pad * 2 - (c.accent ? 4 : 0);
        const lines = c.pill || c.mark !== undefined ? [] : pdfWrap(c.t, ww, b, sz);
        const sub = c.sub ? pdfWrap(c.sub, ww, false, sz - 1.5) : [];
        const ch = c.pill || c.mark !== undefined ? 24 : lines.length * sz * 1.38 + sub.length * (sz - 1.5) * 1.35 + pad * 2 - 2;
        h = Math.max(h, ch);
        return { lines, sub, sz, b };
      });
      if (this.y + h > this.bottom) { this.newPage(false); head(); }
      let x = x0;
      if (row.bg) this.rect(x0, this.y, W, h, row.bg); else if (o.zebra !== false && ri % 2 === 1) this.rect(x0, this.y, W, h, '#F6F8FC');
      cells.forEach((c, i) => {
        const L = lay[i], al = c.align || cols[i].align || 'left';
        if (c.bg) this.rect(x + (o.grid ? 1 : 0), this.y + (o.grid ? 1 : 0), cw[i] - (o.grid ? 2 : 0), h - (o.grid ? 2 : 0), c.bg);
        if (c.accent) this.rect(x + (o.grid ? 1 : 0), this.y + (o.grid ? 1 : 0), 3.5, h - (o.grid ? 2 : 0), c.accent);
        const tx = al === 'center' ? x + cw[i] / 2 : al === 'right' ? x + cw[i] - pad : x + pad + (c.accent ? 4 : 0);
        if (c.mark !== undefined) this.mark(c.mark, x + cw[i] / 2, this.y + h / 2, 14);
        else if (c.pill) {
          const pw = pdfW(c.pill, true, 7.5) + 14, px = al === 'center' ? x + cw[i] / 2 - pw / 2 : x + pad;
          this.rr(px, this.y + h / 2 - 8, pw, 16, 8, c.bg || pMix(PDFC.blue, 0.85));
          this.text(c.pill, px + pw / 2, this.y + h / 2 - 4.5, { size: 7.5, bold: true, color: c.c || PDFC.navy, align: 'center' });
        } else {
          const blockH = L.lines.length * L.sz * 1.38 + L.sub.length * (L.sz - 1.5) * 1.35;
          let ty = this.y + (o.vmid || c.vmid ? (h - blockH) / 2 : pad - 1);
          L.lines.forEach(ln => { this.text(ln, tx, ty, { size: L.sz, bold: L.b, color: c.c || PDFC.ink, align: al }); ty += L.sz * 1.38; });
          L.sub.forEach(ln => { this.text(ln, tx, ty, { size: L.sz - 1.5, color: c.sc || PDFC.muted, align: al }); ty += (L.sz - 1.5) * 1.35; });
        }
        x += cw[i];
      });
      if (o.grid) { let gx = x0; cols.forEach((c, i) => { gx += cw[i]; if (i < cols.length - 1) this.line(gx, this.y, gx, this.y + h, '#FFFFFF', 1.4); }); }
      this.line(x0, this.y + h, x0 + W, this.y + h, '#E3E9F4', 0.6);
      this.y += h;
    });
    this.y += 8;
  }
  stat(items) {
    const n = items.length, W = this.W - 2 * this.M, gap = 10, w = (W - gap * (n - 1)) / n, h = 52;
    this.ensure(h + 10);
    items.forEach((it, i) => {
      const x = this.M + i * (w + gap);
      this.rr(x, this.y, w, h, 8, '#FFFFFF', PDFC.line, 0.7);
      this.rect(x + 10, this.y, 22, 3, it[2] || PDFC.cyan);
      this.text(String(it[0]), x + 12, this.y + 12, { size: 18, bold: true, color: it[2] || PDFC.navy });
      this.text(String(it[1]).toUpperCase(), x + 12, this.y + 36, { size: 6.8, bold: true, color: PDFC.muted, sp: 0.7 });
    });
    this.y += h + 10;
  }
  miniMonth(x, y, w, year, m, colorFn, title) {
    const names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    this.rr(x, y, w, 112, 6, '#FFFFFF', PDFC.line, 0.6);
    this.text(names[m], x + 8, y + 7, { size: 9.5, bold: true, color: PDFC.navy });
    const cw = (w - 12) / 7;
    ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((d, i) => this.text(d, x + 6 + i * cw + cw / 2, y + 22, { size: 6.5, bold: true, color: PDFC.muted, align: 'center' }));
    const first = new Date(year, m, 1).getDay(), n = new Date(year, m + 1, 0).getDate();
    for (let d = 1; d <= n; d++) {
      const idx = first + d - 1, r = Math.floor(idx / 7), c = idx % 7;
      const ds = year + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const col = colorFn(ds), cx = x + 6 + c * cw, cy = y + 32 + r * 13;
      if (col) this.rr(cx + 1, cy - 1, cw - 2, 12, 3, col.bg);
      this.text(String(d), cx + cw / 2, cy + 1, { size: 6.8, bold: !!col, color: col ? col.fg : (c >= 5 ? '#9AA7C0' : PDFC.ink), align: 'center' });
    }
  }
  build() {
    const N = this.pages.length, today = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
    const foot = (this.brand.school ? this.brand.school + '  ·  ' : '') + 'GEMS Classroom Management';
    this.pages.forEach((ops, i) => {
      this.ops = ops;
      this.line(this.M, this.H - 40, this.W - this.M, this.H - 40, PDFC.line, 0.8);
      this.text(foot, this.M, this.H - 31, { size: 7.5, color: PDFC.muted });
      this.text(this.brand.note || ('Generated ' + today), this.W / 2, this.H - 31, { size: 7.5, color: PDFC.muted, align: 'center' });
      this.text('Page ' + (i + 1) + ' of ' + N, this.W - this.M, this.H - 31, { size: 7.5, bold: true, color: PDFC.navy, align: 'right' });
    });
    const objs = [];
    objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    objs[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
    const kids = [];
    this.pages.forEach((ops, i) => {
      const pid = 6 + 2 * i, cid = 7 + 2 * i, body = ops.join('\n');
      kids.push(pid + ' 0 R');
      objs[pid] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents ${cid} 0 R >>`;
      objs[cid] = `<< /Length ${body.length} >>\nstream\n${body}\nendstream`;
    });
    objs[2] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${N} >>`;
    let out = '%PDF-1.4\n'; const offs = [];
    for (let i = 1; i < objs.length; i++) { offs[i] = out.length; out += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
    const xref = out.length;
    out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
    for (let i = 1; i < objs.length; i++) out += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
    return new Blob([bytes], { type: 'application/pdf' });
  }
}

function resultView(r) {

function buildPlan(cls, subj, indId, min, date) {
  const ind = indById(indId);
  const lit = subj !== 'Mathematics';

function tchOf(id) { return DB.teachers.find(t => t.id === id) || null; }

/* Pure: returns the plan without changing data.
   'mix'    : every level is shared out in turn, so each teacher gets a fair share of every level.
   'levels' : teachers take consecutive blocks of levels, so similar levels are taught together. */
function computeDistribution(mode) {
  const T = DB.teachers;
  if (!T.length) return null;
  const order = DB.levels.slice();
  const all = DB.students.slice().sort((a, b) => (order.indexOf(a.level) - order.indexOf(b.level)) || a.name.localeCompare(b.name));
  const out = T.map(t => ({ t, list: [] }));
  if (mode === 'levels') {
    const n = all.length, base = Math.floor(n / T.length), rem = n % T.length;
    let k = 0;
    out.forEach((o, i) => { const size = base + (i < rem ? 1 : 0); o.list = all.slice(k, k + size); k += size; });
  } else {
    let g = 0;
    order.forEach(l => { all.filter(s => s.level === l).forEach(s => { out[g % T.length].list.push(s); g++; }); });
    all.filter(s => !order.includes(s.level)).forEach(s => { out[g % T.length].list.push(s); g++; });
  }
  return out;
}

function coded(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
async function askClaude(prompt, files, tier, signal) {

  try { s = window.claude ? await window.claude.use('sample') : null; } catch (e) { s = null; }
  if (!s) throw coded('unavailable');
  let lim = {};
  try { lim = await s.limits(); } catch (e) {}
  if (files && (!lim || !lim.images)) throw coded('images_unavailable');
  const opts = { modelTier: tier || 'default', cache: false };

  if (signal) opts.signal = signal;

function parseJSON(t) {

}
function shrink(file, max, q) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      if (q) { res(c.toDataURL('image/jpeg', q)); URL.revokeObjectURL(url); return; }
      c.toBlob(b => { URL.revokeObjectURL(url); res(b || file); }, 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(q ? null : file); };
    img.src = url;
  });
}
function checkArith(q, got) {
  const clean = String(q).replace(/\(unclear\)\s*/i, '').replace(/^\s*\d+[.)]\s*/, '').replace(/\s+/g, '');
  const m = clean.match(/^(-?\d+(?:\.\d+)?)([x×*+\-−÷\/])(-?\d+(?:\.\d+)?)=?\??$/i);
  if (!m) return null;
  const a = parseFloat(m[1]), b = parseFloat(m[3]), op = m[2];
  let v;
  if (op === '+') v = a + b; else if (op === '-' || op === '−') v = a - b; else if (op === '÷' || op === '/') v = b === 0 ? NaN : a / b; else v = a * b;
  if (!isFinite(v)) return null;
  v = Math.round(v * 1e6) / 1e6;
  const g = parseFloat(String(got).replace(/[^\d.\-]/g, ''));
  return { right: String(v), ok: !isNaN(g) && Math.abs(g - v) < 1e-9 };
}

  const names = DB.students.map(s => s.name).join(', ');
  const prompt = `You are an experienced primary school teacher. A teacher photographed a student's work.
1. Find any student name written on the work and match it to this class list: ${names || 'none'}. Return the name exactly as in the list, or "" if none matches.
2. Choose the ONE curriculum indicator below that this work is about. Return its id, or "" if none fits.
${list}
3. Mark ONLY the questions and answers visible in this photo, in order. Copy each student answer exactly as written. Never invent or repeat questions. If an answer cannot be read, set "unclear": true for that item.
4. Give a verdict: "Correct", "Partly correct", "Wrong", or "Unreadable". Be fair and encouraging.
Reply with JSON only, no markdown: {"student":"","indicatorId":"","verdict":"","score":0,"feedback":"one or two short sentences for the teacher","answer":"the right answer or a short model response","items":[{"question":"","studentAnswer":"","correctAnswer":"","ok":true,"unclear":false}]}`;

S.distN = S.distN || 0;
function groupOf(id) { return DB.classes.find(c => c.id === id) || null; }
function groupTeacher(g) { return g ? tchOf(g.tch) : null; }
function groupStudents(gid) { return DB.students.filter(s => s.cls === gid).sort((a, b) => a.name.localeCompare(b.name)); }
function groupLetter(i) { return 'Group ' + String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : ''); }
/* Pure: split all students into N groups. Each group i gets teacher i (wrapping if fewer teachers). */
function computeGroupPlan(mode, N) {
  const T = DB.teachers;
  if (!T.length) return null;
  N = Math.max(1, Math.min(N || T.length, 20));
  const order = DB.levels.slice();
  const all = DB.students.slice().sort((a, b) => (order.indexOf(a.level) - order.indexOf(b.level)) || a.name.localeCompare(b.name));
  const buckets = Array.from({ length: N }, () => []);
  if (mode === 'levels') {
    const n = all.length, base = Math.floor(n / N), rem = n % N;
    let k = 0;
    buckets.forEach((b, i) => { const size = base + (i < rem ? 1 : 0); b.push(...all.slice(k, k + size)); k += size; });
  } else {
    let g = 0;
    order.forEach(l => { all.filter(s => s.level === l).forEach(s => { buckets[g % N].push(s); g++; }); });
    all.filter(s => !order.includes(s.level)).forEach(s => { buckets[g % N].push(s); g++; });
  }
  return buckets.map((list, i) => ({ idx: i, name: DB.classes[i] ? DB.classes[i].name : groupLetter(i), t: T[i % T.length], list }));
}
function applyGroupPlan(plan) {
  plan.forEach((p, i) => {
    let g = DB.classes[i];
    if (!g) { g = { id: uid(), name: p.name, tch: '' }; DB.classes.push(g); }
    g.tch = p.t.id;
    p.list.forEach(s => { const st = DB.students.find(x => x.id === s.id); if (st) { st.cls = g.id; st.tch = p.t.id; } });
  });
  DB.students.forEach(s => { const g = groupOf(s.cls); s.tch = g ? g.tch : s.tch; });
  if (!groupOf(S.cls)) S.cls = DB.classes[0].id;
}

/* ---------- Student import from a file ---------- */
function splitRow(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function parseStudents(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], skipped: 0 };
  const first = lines[0];
  const d = first.includes('\t') ? '\t' : (first.includes(';') && !first.includes(',') ? ';' : ',');
  const rows = lines.map(l => splitRow(l, d));
  const head = rows[0].map(h => h.toLowerCase());
  const known = ['name', 'student', 'full name', 'level', 'group', 'class', 'teacher', 'need', 'support', 'guardian', 'phone'];
  const hasHead = head.some(h => known.includes(h));
  const body = hasHead ? rows.slice(1) : rows;
  const col = names => head.findIndex(h => names.includes(h));
  const ix = hasHead ? { name: col(['name', 'student', 'full name']), level: col(['level']), group: col(['group', 'class']), teacher: col(['teacher']), need: col(['need', 'support']), guardian: col(['guardian', 'parent']), phone: col(['phone']) }
    : { name: 0, level: 1, group: 2, teacher: 3, need: -1, guardian: -1, phone: -1 };
  const get = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
  let skipped = 0;
  const out = body.map(r => {
    const name = get(r, ix.name >= 0 ? ix.name : 0);
    if (!name) { skipped++; return null; }
    return { name, level: get(r, ix.level), group: get(r, ix.group), teacher: get(r, ix.teacher), need: get(r, ix.need), guardian: get(r, ix.guardian), phone: get(r, ix.phone) };
  }).filter(Boolean);
  const seen = new Set(), unique = [];
  out.forEach(s => { const k = s.name.toLowerCase(); if (seen.has(k) || DB.students.some(x => x.name.toLowerCase() === k)) { skipped++; return; } seen.add(k); unique.push(s); });
  return { rows: unique, skipped };
}
function placeInGroup(level, groupName) {
  if (groupName) {
    let g = DB.classes.find(c => c.name.toLowerCase() === groupName.toLowerCase());
    if (!g) { g = { id: uid(), name: groupName, tch: '' }; DB.classes.push(g); }
    return g;
  }
  if (!DB.classes.length) DB.classes.push({ id: uid(), name: groupLetter(0), tch: '' });
  return DB.classes.slice().sort((a, b) => {
    const la = DB.students.filter(s => s.cls === a.id && s.level === level).length, lb = DB.students.filter(s => s.cls === b.id && s.level === level).length;
    if (la !== lb) return la - lb;
    return DB.students.filter(s => s.cls === a.id).length - DB.students.filter(s => s.cls === b.id).length;
  })[0];
}

/* ==================== Excel (.xlsx) import, read on the device ==================== */
async function inflateRaw(data, method) {
  if (method === 0) return new TextDecoder().decode(data);
  if (method !== 8) throw new Error('Unsupported Excel compression');
  if (typeof DecompressionStream === 'undefined') throw new Error('Browser too old for Excel import');
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}
async function unzipEntries(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('Not a zip-based Excel file');
  const count = dv.getUint16(eocd + 10, true), cdOff = dv.getUint32(eocd + 16, true);
  const files = {}, dec = new TextDecoder();
  let p = cdOff;
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
    files[name] = await inflateRaw(u8.subarray(start, start + csize), method);
    p += 46 + nlen + xlen + clen;
  }
  return files;
}
function colIndex(ref) {
  const letters = (ref.match(/[A-Z]+/) || [''])[0];
  let n = 0; for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return Math.max(0, n - 1);
}
function firstSheetRows(files) {
  const parse = x => new DOMParser().parseFromString(x, 'application/xml');
  const sst = [];
  if (files['xl/sharedStrings.xml']) {
    Array.from(parse(files['xl/sharedStrings.xml']).getElementsByTagName('si')).forEach(si => {
      sst.push(Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''));
    });
  }
  const sheetName = Object.keys(files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a, b) => Number(a.match(/\d+/)[0]) - Number(b.match(/\d+/)[0]))[0];
  if (!sheetName) throw new Error('No worksheet found');
  const rows = [];
  Array.from(parse(files[sheetName]).getElementsByTagName('row')).forEach(r => {
    const arr = [];
    Array.from(r.getElementsByTagName('c')).forEach(c => {
      const col = colIndex(c.getAttribute('r') || '');
      const t = c.getAttribute('t');
      let v = '';
      if (t === 's') { const vv = c.getElementsByTagName('v')[0]; v = sst[Number(vv ? vv.textContent : -1)] || ''; }
      else if (t === 'inlineStr') v = Array.from(c.getElementsByTagName('t')).map(x => x.textContent).join('');
      else { const vv = c.getElementsByTagName('v')[0]; v = vv ? vv.textContent : ''; }
      arr[col] = String(v == null ? '' : v).trim();
    });
    rows.push(Array.from(arr, x => x == null ? '' : x));
  });
  return rows;
}
function gridToCsv(rows) {
  return rows.filter(r => r.some(c => String(c).trim() !== '')).map(r => r.map(c => {
    const s = String(c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
}

/* ==================== Full student register import ==================== */
const REG = {
  name: ['name', 'student', 'full name'], dvName: ['ނަން', 'dhivehi name'], level: ['level', 'reading level'],
  group: ['group', 'class'], teacher: ['teacher'],
  need: ['categories of complex learning profile', 'learning profile', 'need', 'support'],
  guardian: ['parent name', 'guardian', 'parent'], phone: ['parent contact', 'phone', 'contact'],
  indexNo: ['index no', 'index number', 'index'], nid: ['nid no', 'nid number', 'nid'], address: ['address'], program: ['program', 'programme']
};
const cleanCell = v => String(v == null ? '' : v).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
function parseStudents(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], skipped: 0 };
  const first = lines[0];
  const d = first.includes('\t') ? '\t' : (first.includes(';') && !first.includes(',') ? ';' : ',');
  const rows = lines.map(l => splitRow(l, d).map(cleanCell));
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    if (rows[i].some(c => REG.name.includes(c.toLowerCase()))) { hi = i; break; }
  }
  const head = hi >= 0 ? rows[hi].map(c => c.toLowerCase()) : null;
  const body = hi >= 0 ? rows.slice(hi + 1) : rows;
  let ix;
  if (head) {
    ix = {};
    Object.keys(REG).forEach(k => { ix[k] = head.findIndex(h => REG[k].includes(h)); });
  } else {
    ix = { name: 0, level: 1, group: 2, teacher: 3 };
    Object.keys(REG).forEach(k => { if (ix[k] === undefined) ix[k] = -1; });
  }
  const get = (r, i) => (i >= 0 && r[i] != null ? cleanCell(r[i]) : '');
  let skipped = 0;
  const out = body.map(r => {
    const name = get(r, ix.name >= 0 ? ix.name : 0);
    if (!name) { skipped++; return null; }
    const o = { name };
    Object.keys(REG).forEach(k => { if (k !== 'name') o[k] = get(r, ix[k]); });
    return o;
  }).filter(Boolean);
  const seen = new Set(), unique = [];
  out.forEach(s => {
    const k = s.name.toLowerCase();
    if (seen.has(k) || DB.students.some(x => x.name.toLowerCase() === k)) { skipped++; return; }
    seen.add(k); unique.push(s);
  });
  return { rows: unique, skipped };
}
function gridToCsv(rows) {
  return rows.filter(r => r.some(c => String(c).trim() !== '')).map(r => r.map(c => {
    const s = cleanCell(c);
    return /[",]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
}

function drawIcon(size, theme) {
  const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  const c = cv.getContext('2d'), k = size / 64, P = (x, y) => [x * k, y * k];
  const bee = theme !== 'blue';
  const g = c.createLinearGradient(0, 0, size, size);
  if (bee) { g.addColorStop(0, '#5CC8C2'); g.addColorStop(0.55, '#1A8C8C'); g.addColorStop(1, '#0F5C5C'); }
  else { g.addColorStop(0, '#3B7BEA'); g.addColorStop(0.6, '#0A2F72'); g.addColorStop(1, '#061A44'); }
  const poly = (pts, fill) => { c.beginPath(); pts.forEach((p, i) => { const q = P(p[0], p[1]); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath(); c.fillStyle = fill; c.fill(); };
  c.fillStyle = g; c.beginPath(); c.roundRect ? c.roundRect(0, 0, size, size, size * 0.28) : c.rect(0, 0, size, size); c.fill();
  poly([[32, 2], [58, 17], [58, 47], [32, 62], [6, 47], [6, 17]], bee ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.14)');
  poly([[21, 21], [43, 21], [49, 29], [32, 47], [15, 29]], '#FFFFFF');
  poly([[21, 21], [32, 29], [15, 29]], bee ? '#9FE3DC' : '#BFE3F7');
  poly([[43, 21], [49, 29], [32, 29]], bee ? '#5CC8C2' : '#8FD8F8');
  return cv.toDataURL('image/png');
}

/* Opening: honeycomb fills in, logo turns into place, a bee flies a loop, then the name appears. */
function buildOpening() {
  const sp = document.getElementById('splash'); if (!sp) return;
  const W = 390, H = 844, r = 24, w = r * Math.sqrt(3), h = r * 1.5, cx = W / 2, cy = H * 0.42;
  let cells = '';
  for (let row = -2; row < H / h + 2; row++) {
    for (let col = -2; col < W / w + 2; col++) {
      const x = col * w + (row % 2 ? w / 2 : 0), y = row * h;
      const d = Math.hypot(x - cx, y - cy);
      const pts = [0, 60, 120, 180, 240, 300].map(a => { const t = a * Math.PI / 180; return (x + (r - 2) * Math.cos(t)).toFixed(1) + ',' + (y + (r - 2) * Math.sin(t)).toFixed(1); }).join(' ');
      const gold = ((row + col) % 5 === 0);
      cells += `<polygon class="hx ${gold ? 'hx-gold' : ''}" points="${pts}" style="--d:${(d / 520).toFixed(2)}s"/>`;
    }
  }
  sp.insertAdjacentHTML('afterbegin', `<svg class="honey" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${cells}</svg>`);
  const c = sp.querySelector('.c');
  if (c && !sp.querySelector('.tagline')) {
    c.insertAdjacentHTML('beforeend', '<div class="tagline">LEARN <i></i> TRACK <i></i> GROW</div>');

  if (beeOn()) sp.insertAdjacentHTML('beforeend', `<div class="bee-loop" aria-hidden="true">${beeSVG(46)}</div>`);
}

/* ==================== Teachers first: many groups under each teacher, by reading level ==================== */
S.distMode = (S.distMode === 'level') ? 'level' : 'teacher';
function teacherOfStudent(s) {
  const g = groupOf(s.cls);
  if (g && tchOf(g.tch)) return g.tch;
  if (s.tch && tchOf(s.tch)) return s.tch;
  return null;
}
/* Pure: who gets which group. Students with no teacher are shared out evenly across teachers first. */
function planTeacherGroups(mode) {
  const T = DB.teachers;
  if (!T.length) return null;
  const order = DB.levels.slice();
  const stu = DB.students.slice().sort((a, b) => (order.indexOf(a.level) - order.indexOf(b.level)) || a.name.localeCompare(b.name));
  const owner = {};
  stu.forEach(s => { const t = teacherOfStudent(s); if (t) owner[s.id] = t; });
  let rr = 0;
  stu.filter(s => !owner[s.id]).forEach(s => { owner[s.id] = T[rr % T.length].id; rr++; });
  const plan = [];
  T.forEach(t => {
    const mine = stu.filter(s => owner[s.id] === t.id);
    if (mode === 'teacher') {
      plan.push({ name: t.name + ' · All', tid: t.id, list: mine, level: '' });
    } else {
      order.forEach(l => {
        const lst = mine.filter(s => s.level === l);

  DB.students.forEach(s => { const g = groupOf(s.cls); if (g && g.tch) s.tch = g.tch; });

    if (empty && leftover && DB.classes.length > 1) { delete DB.tt[g.id]; return false; }

/* ==================== Auto-group: 7 teachers, share students by reading level or grade ==================== */
S.dkey = S.dkey || 'level';

function keyOf(s, key) {
  if (key === 'level') return s.level || 'Not set';
  if (key === 'grade') return gradeOf(s);
  return 'All';
}
/* Pure: which teacher gets which students, and the groups under each teacher. */
function planShare() {
  const T = DB.teachers;
  if (!T.length) return null;
  const key = S.dkey, mode = S.dmode;
  const stu = DB.students.slice().sort((a, b) => keyOf(a, key).localeCompare(keyOf(b, key)) || a.name.localeCompare(b.name));
  const owner = {};
  if (key === 'none' || mode === 'mix') {
    let g = 0;
    const byKey = {};
    stu.forEach(s => { const k = keyOf(s, key); (byKey[k] = byKey[k] || []).push(s); });
    Object.keys(byKey).sort().forEach(k => byKey[k].forEach(s => { owner[s.id] = T[g % T.length].id; g++; }));
  } else {
    const n = stu.length, base = Math.floor(n / T.length), rem = n % T.length;
    let k = 0;
    T.forEach((t, i) => { const size = base + (i < rem ? 1 : 0); stu.slice(k, k + size).forEach(s => { owner[s.id] = t.id; }); k += size; });
  }
  const plan = [];
  T.forEach(t => {
    const mine = stu.filter(s => owner[s.id] === t.id);
    if (key === 'none') { if (mine.length) plan.push({ name: t.name + ' · All', tid: t.id, list: mine, value: '' }); return; }
    [...new Set(mine.map(s => keyOf(s, key)))].sort().forEach(v => plan.push({ name: t.name + ' · ' + v, tid: t.id, list: mine.filter(s => keyOf(s, key) === v), value: v }));
  });
  return plan;
}

/* ==================== Opening: spiral of dots unfolds from the logo, with a ripple (no diamond, no grid) ==================== */
function buildOpening() {
  const sp = document.getElementById('splash'); if (!sp) return;
  const W = 390, H = 844, cx = 195, cy = 346, N = 260, golden = 137.508 * Math.PI / 180;
  let dots = '';
  for (let i = 1; i <= N; i++) {
    const r = 9.5 * Math.sqrt(i), a = i * golden;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
    const size = (i % 7 === 0) ? 2.6 : 1.5;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}" style="--d:${(0.15 + i * 0.011).toFixed(3)}s"/>`;
  }
  const ripples = [0, 1].map(k => `<circle class="rip" cx="${cx}" cy="${cy}" r="30" style="--d:${(0.6 + k * 0.5).toFixed(2)}s"/>`).join('');
  sp.insertAdjacentHTML('afterbegin', `<svg class="spiral" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ripples}${dots}</svg>`);
  const c = sp.querySelector('.c');
  if (c && !sp.querySelector('.tagline')) c.insertAdjacentHTML('beforeend', '<div class="tagline">LEARN <i></i> TRACK <i></i> GROW</div>');
}

alter table public.gems_students enable row level security;
alter table public.gems_attendance enable row level security;
-- No public policies: the anon key cannot read or write these tables until teacher sign-in rules are added.`
function vCloud() {
  const c = DB.cloud || {};
  return `<div class="between"><h1>Cloud (Supabase)</h1></div>
  <div class="sub">Connect your Supabase project. Your data stays on this device until you turn on sync.</div>
  <div class="card" style="margin-top:12px">
    <label class="f" style="margin-top:0">Project URL<input id="cl_url" placeholder="https://your-project.supabase.co" value="${esc(c.url || '')}"></label>
    <label class="f">Anon (publishable) key<input id="cl_key" placeholder="eyJ..." value="${esc(c.key || '')}"></label>
    <div class="sub" style="margin-top:8px">Use the anon key only. Never paste the service_role key here.</div>
    <div class="row" style="margin-top:12px"><button class="btn sm" data-a="clSave">Save</button><button class="btn ghost sm" data-a="clTest">Test connection</button></div>
    <div id="clStatus" class="sub" style="margin-top:10px"></div>
  </div>
  <div class="sec"><h3>Database setup</h3></div>
  <div class="card"><div class="sub" style="margin-bottom:8px">Copy this into the Supabase SQL Editor and run it once.</div>
    <pre style="white-space:pre-wrap;font-size:12px;background:#F3F6FB;border-radius:12px;padding:12px;overflow:auto">${esc(CLOUD_SQL)}</pre>
    <div class="row"><button class="btn ghost sm" data-a="clCopy">Copy SQL</button></div></div>`;
}
Object.assign(ACT, {
  clSave: () => {
    const url = ($('#cl_url').value || '').trim().replace(/\/+$/, ''), key = ($('#cl_key').value || '').trim();
    if (url && !/^https:\/\/.+\.supabase\.co$/i.test(url) && !/^https:\/\//.test(url)) return toast('The URL must start with https://');
    DB.cloud = { url, key }; save(); toast('Connection saved on this device'); render();
  },
  clTest: async () => {
    const url = (DB.cloud && DB.cloud.url) || '', key = (DB.cloud && DB.cloud.key) || '';
    const out = $('#clStatus');
    if (!url || !key) { if (out) out.textContent = 'Enter the URL and anon key, then Save.'; return; }
    if (out) out.textContent = 'Testing…';
    try {
      const r = await fetch(url + '/rest/v1/', { headers: { apikey: key, Authorization: 'Bearer ' + key } });
      if (r.status === 401 || r.status === 403) { if (out) out.innerHTML = '<span style="color:#A52E2E">Key rejected (' + r.status + '). Check the anon key.</span>'; return; }
      if (out) out.innerHTML = '<span style="color:#1E9E6A">Connected. Supabase answered with status ' + r.status + '.</span>';
    } catch (e) {
      if (out) out.innerHTML = '<span style="color:#A52E2E">Could not reach the project. Check the URL and your internet connection.</span>';
    }
  },
  clCopy: async () => {
    try { await navigator.clipboard.writeText(CLOUD_SQL); toast('SQL copied'); } catch (e) { toast('Select the text and copy it manually'); }
  }
});
(function () {
  const prev = routeMain;
  routeMain = function () { if (cur() === 'cloud') return vCloud(); return prev(); };
  Object.assign(TOP_TITLE, { cloud: 'Cloud (Supabase)' });
  const prevMore = vMore;
  vMore = function () {
    const html = prevMore();
    return html.replace('<div class="card">', '<div class="card"><div class="li" data-a="stack" data-v="cloud"><div class="ico">' + ico('gear', 20) + '</div><div class="grow"><b>Cloud (Supabase)</b><div class="sub">Connect the database</div></div>' + ico('chev', 18) + '</div>');
  };
})();

/* ==================== Header, bottom bar, render, start ==================== */
const NAV = [['home', 'Home', 'home'], ['students', 'Students', 'people'], ['attend', 'Attend', 'check'], ['tt', 'Timetable', 'grid'], ['more', 'More', 'dots']];
function renderTop() {
  const c = cur();
  const me = tchOf(DB.me), who = me ? me.name : 'GEMS';
  const dateLine = dOf(today()).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const title = c ? (TOP_TITLE[c.split(':')[0]] || TOP_TITLE2[c.split(':')[0]] || '') : (S.tab === 'home' ? greet(new Date().getHours()) : TAB_TITLE[S.tab]);
  const back = `<button class="hb" data-a="back" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC.back}</svg></button>`;
  $('#top').innerHTML = `<div class="tr">
      ${c ? back : `<div class="mk">${logoSVG(30, false, 'top')}</div>`}
      <div class="brandtxt"><div class="bn">${c ? esc(title) : 'GEMS'}</div></div>
      <button class="me" data-a="tab" data-v="more" aria-label="Account: ${esc(who)}">${esc(initials(who))}</button></div>
    <div class="ptitle"><div class="pdate">${esc(dateLine)}</div>${S.tab === 'home' && !c ? `<div class="pt">${esc(title)}</div>` : ''}</div>`;
}
function renderNav() {
  const cur2 = cur() ? (cur().split(':')[0]) : null;
  const moreSet = ['calendar', 'mark', 'plans', 'planNew', 'plan', 'reports', 'settings', 'evNew'];
  const active = S.tab === 'more' && !cur() ? 'more' : (cur() && moreSet.includes(cur2) && S.tab !== 'home' ? 'more' : S.tab);
  $('#nav').innerHTML = NAV.map(([k, l, i]) => `<button class="${active === k ? 'on' : ''}" data-a="tab" data-v="${k}" aria-label="${l}">${i === 'dots' ? '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>' : `<svg viewBox="0 0 24 24">${IC[i]}</svg>`}<span>${l}</span></button>`).join('');
}
function animateCounts() {
  document.querySelectorAll('.kpi b').forEach(el => {
    const end = parseInt(el.textContent, 10);
    if (isNaN(end) || el.textContent.trim() !== String(end)) return;
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 650); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function render() {
  const openGp = !!(document.querySelector('details.gp') && document.querySelector('details.gp').open);
  renderTop(); renderNav();
  const m = $('#main');
  m.innerHTML = routeMain();
  if (openGp) { const g = document.querySelector('details.gp'); if (g) g.open = true; }
  if (page() === 'students' && !cur()) drawStList();
  animateCounts();
  const pg = document.querySelector('.kpi'); void pg;
}
function showErr(err) {
  const msg = (err && err.message) || 'Unknown error';
  let d = document.getElementById('gems-err');
  if (!d) { d = document.createElement('div'); d.id = 'gems-err'; d.style.cssText = 'position:fixed;inset:0;z-index:200;background:#F2F5FA;padding:28px 20px;overflow:auto;font-family:system-ui,sans-serif'; document.body.appendChild(d); }
  d.innerHTML = '<h2 style="margin:0 0 8px">Something went wrong</h2><p style="color:#5C6B88">Your saved data is safe. Tap Reload. If it happens again, send this message:</p><pre style="white-space:pre-wrap;background:#fff;border:1px solid #DCE4F1;border-radius:10px;padding:12px;font-size:13px"></pre><button onclick="location.reload()" style="background:#1F5BC4;color:#fff;border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:800">Reload</button>';
  d.querySelector('pre').textContent = msg;
}
window.addEventListener('error', e => { const sp = document.getElementById('splash'); if (sp) sp.remove(); showErr(e.error || { message: e.message }); });
window.addEventListener('unhandledrejection', e => { showErr(e.reason || { message: 'Unhandled error' }); });

function boot() {
  DB.theme = 'blue';
  buildOpening();
  applyTheme(); setAppIcon(false);
  const sp = document.getElementById('splash');

  if (sp) for (let i = 0; i < 9; i++) {
    const d = document.createElement('span'); d.className = 'drift';
    d.style.left = (6 + Math.random() * 88) + '%'; d.style.top = (8 + Math.random() * 84) + '%';
    d.style.animationDelay = (Math.random() * 6).toFixed(2) + 's'; d.style.animationDuration = (5 + Math.random() * 4).toFixed(2) + 's';
    d.style.setProperty('--sz', (6 + Math.random() * 8).toFixed(1) + 'px'); sp.appendChild(d);
  }
  $('#splashLogo').innerHTML = logoSVG(136, true, 'sp');
  $('#splashWord').innerHTML = LOGO_WORD.split('').map((ch, i) => `<span style="--k:${i}">${ch}</span>`).join('');
  try { render(); } catch (e) { showErr(e); }
  setTimeout(() => { const s = document.getElementById('splash'); if (s) { s.classList.add('out'); setTimeout(() => s.remove(), 950); } }, 3300);
}
boot();
</script>
</body>
</html>
